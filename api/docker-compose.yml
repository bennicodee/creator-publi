# Banco de desenvolvimento: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creatorpubli
      POSTGRES_USER: creatorpubli
      POSTGRES_PASSWORD: creatorpubli
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorpubli"]
      interval: 5s
      retries: 10

  # Caixa de entrada falsa para testar e-mails: SMTP em localhost:1025, caixa em http://localhost:8025
  mail:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
